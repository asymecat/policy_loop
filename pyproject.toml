[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-loop"
version = "0.1.0"
description = "PolicyLoop - OpenHarmony SELinux security policy diagnosis & least-privilege repair agent (deterministic core)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "PolicyLoop Team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Operating System Kernels",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["policy_loop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
