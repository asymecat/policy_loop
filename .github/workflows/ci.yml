name: CI

# 三道作业各自回答一个不同的问题：
#   unit     —— 代码还对吗（unittest 与 pytest 两个口径都要跑，见下）
#   docgate  —— 文稿说的还是真的吗（配图/数字/占位符/一致性）
#   docx     —— report.docx 与 report.md 还对得上吗（要固定 pandoc 版本才判得准）
#
# 语料（data/raw）不入库，所以这里不跑 --live；那一条由 docgate-live.yml 每周兜。

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 两个口径都跑：unittest 是本仓承诺的"零第三方依赖"口径，pytest 是报告里
      # 那个「372 通过 / 5 跳过」的来源。2026-10-24 起两者收的是同一批 377 项
      # （此前 test_attribution.py 是 pytest 风格，unittest 根本收不到它，
      # 所以在 3.12 上既少 36 项又多一条 ImportError）。
      - run: python -m pip install --upgrade pip pytest
      - name: selfcheck
        run: python -m policy_loop.selfcheck
      - name: unittest
        run: python -m unittest discover -s tests -v
      - name: pytest
        run: python -m pytest -q

  docgate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # data/raw 不在仓库里 —— docgate 自己会说"这些活探针跳过"，而不是装作通过。
      # 真失败（值不符 / 锚点没了 / 未登记的声明）一律 exit 1。
      - name: docgate（文稿 ↔ 真值清单 ↔ 能验到的产物）
        run: python tools/docgate.py
      - name: 门禁本身的反控测试
        run: python -m unittest tests.test_docgate -v

  docx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 原来的 pandoc/setup-pandoc 仓库已不存在（Set up job 直接报
      # "Unable to resolve action ... repository not found"），动作已迁到
      # pandoc/actions/setup，输入名从 pandoc-version 改成 version。
      - uses: pandoc/actions/setup@v1
        with:
          # 必须与生成 report.docx 的版本**逐位**相同：docx 门禁比的是
          # word/document.xml 的 sha256，而 3.1.11 与 3.1.11.1 产出的
          # XML 不同（实测：用 3.1.11 跑 --check 直接判“不一致”）。
          # 登记值见 docs/facts.json 的 provenance_env。
          version: "3.1.11.1"
      - run: python -m pip install --upgrade pip "python-docx==1.2.0" "lxml==6.1.1"
      - name: report.docx 必须与 report.md 一致
        run: python tools/docgate.py --only docx --strict-env
