{
    "comment" : [
        "PolicyLoop 板端修复服务。把「denial → 最小补丁」的结果装进内核，不需要 PC。",
        "",
        "为什么要独立一个服务、而不是把权限加在 pl_collector 上：",
        "它要拿 security:load_policy —— 全策略唯一一份 —— 那是整份策略里最重的一条",
        "权限。采集器一条特权都不要（那样它才能继续当「最小域」来讲）；把重权限单独",
        "收进一个域，是为了让审计面收敛到一个百来行的手写 .cil 上。",
        "",
        "与 pl_collector 那份 cfg 的三处不同，每一处都是刻意的：",
        "  1. secon   u:r:pl_fixer:s0 —— 新域，一条条显式授予，同样**不依赖任何 permissive**。",
        "  2. caps    只有 DAC_OVERRIDE，**没有 SYSLOG**。采集器要 SYSLOG 是因为它读",
        "             /dev/kmsg 而板子 dmesg_restrict=1；修复器一条审计流都不读",
        "             （它只读 live.jsonl 与 /sys/fs/selinux/*），所以不给。",
        "             ★ caps 是**整套替换**不是追加（init_common_service.c:233-255 零初始化",
        "             后 capset），所以写 [\"DAC_OVERRIDE\"] 的含义是「只有这一个能力」。",
        "             DAC_OVERRIDE 必需：应用沙箱是 0700、属主是应用 uid，本服务以 root 跑，",
        "             要穿进去读写 fix.req / fix.sel / fix.out 就必须真的能覆盖 DAC；",
        "             而 DAC 失败**不产生 AVC**，漏了它只会看到「服务活着但什么都读不到」。",
        "  3. jobs    没有 printk 限流那个 job。那个 job 是给 /dev/kmsg 那条路的",
        "             （audit→printk 镜像过 printk_ratelimit，超出直接丢）。修复器不走那条路。",
        "",
        "★ 服务常驻（once=0），原因是它靠轮询应用沙箱里的 fix.req 工作 ——",
        "应用没有「启动一个 init service」的权限，所以只能由板子这边主动看着。",
        "代价是 load_policy 这份权限是常驻的；这一点在报告里必须如实写，",
        "不能只讲「点一下就能修」。",
        "",
        "★ 下面 --dir 指向应用沙箱，与 pl_collector 的那条完全相同：",
        "  那是**应用与 board 侧之间唯一的一条通道**，应用读自己的文件本来就允许，",
        "  所以不需要给应用加任何一条策略。"
    ],
    "jobs" : [],
    "services" : [{
            "name" : "pl_fixer",
            "path" : ["/system/bin/pl_fixer",
                      "--fix",
                      "--dir", "/data/app/el2/100/base/com.policyloop.console/haps/entry/files"],
            "uid" : "root",
            "gid" : ["system"],
            "once" : 0,
            "disabled" : 0,
            "sandbox" : 0,
            "caps" : ["DAC_OVERRIDE"],
            "secon" : "u:r:pl_fixer:s0"
        }
    ]
}
