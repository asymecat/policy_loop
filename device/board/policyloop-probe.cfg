{
    "comment" : [
        "★ 演示变体：与 policyloop.cfg 只有一处不同 —— 多一个 --debug-log。",
        "",
        "这是「开发者在环」那条动线的**真实**来源，不是伪造的日志行。",
        "采集器有一个可选的调试出口（--debug-log <path>），开发期把它指向",
        "/data/local/tmp —— 而 pl_collector 这个域**故意**在那里一无所有：",
        "策略里没有任何一条 allow 提到 data_local / data_local_tmp。",
        "于是每个会话窗口一打开，那一次 fopen 就是一条真的 avc denied，",
        "scontext 正是 u:r:pl_collector:s0，permissive=0，enforcing 域。",
        "",
        "为什么这件事值得演示：板子上很难**按需**造出一条 denial。三方应用",
        "的权限失败停在 framework/JS 层，根本不产生 AVC；等板子自己犯错要碰运气。",
        "这条链路把「一个系统组件在运行时被拒 → 工具在 1 秒内给出分类与最小补丁」",
        "变成可复现、可反复演示的。",
        "",
        "为什么不是编译期开关：把演示行为编进二进制，就得有两份二进制、两套验证。",
        "做成命令行参数，则二进制只有一份（就是交付的那份），是否触发纯属部署选择。",
        "默认不传这个参数 ⇒ 交付形态与 policyloop.cfg 逐字节等价。",
        "",
        "两份 cfg 的一致性由 install_service.sh 的 cfg 子命令自检（只允许差这一项），",
        "免得哪天改了这份忘了那份。",
        "",
        "其余字段的含义见 policyloop.cfg 的注释（sandbox / secon / caps 三条都是坑）。",
        "",
        "jobs 段与 policyloop.cfg 逐字相同 —— 关掉 printk 限流是 --kmsg 这条路的前提，",
        "与是不是演示形态无关。理由见 policyloop.cfg 的注释。"
    ],
    "jobs" : [{
            "name" : "init",
            "cmds" : [
                "write /proc/sys/kernel/printk_ratelimit 0",
                "write /proc/sys/kernel/printk_ratelimit_burst 100000"
            ]
        }
    ],
    "services" : [{
            "name" : "pl_collector",
            "path" : ["/system/bin/pl_collector",
                      "--guard", "--dedupe", "--kmsg",
                      "--dir", "/data/app/el2/100/base/com.policyloop.console/haps/entry/files",
                      "--debug-log", "/data/local/tmp/pl_debug.log"],
            "uid" : "root",
            "gid" : ["system"],
            "once" : 0,
            "disabled" : 0,
            "sandbox" : 0,
            "caps" : ["SYSLOG", "DAC_OVERRIDE"],
            "secon" : "u:r:pl_collector:s0"
        }
    ]
}
