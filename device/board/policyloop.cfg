{
    "comment" : [
        "PolicyLoop 采集服务。板端常驻，开机自启，不需要 PC、不需要 su。",
        "",
        "它顶替的是 device/board/pl_guard.sh 那种形态：脚本版跑在 su 域里，",
        "而 su 在 eng 版是 typepermissive —— 能写进应用沙箱纯属侥幸，",
        "换个 enforcing 的机型就整条链路失效。这里换成自己的域 pl_collector，",
        "它一条条被显式授予（syslog_read + dev_kmsg_file read + 写应用沙箱），",
        "没有任何 permissive 兜底。",
        "",
        "三条容易看漏但必需的字段：",
        "  sandbox : 0  —— 不设会走默认路径，而我们需要看见真实的 /data，",
        "                  进了独立 mount namespace 就找不到应用沙箱了。",
        "  secon        —— 这个域**只**由这里指定。init 在 exec 前调 setexeccon()，",
        "                  内核那条路是自检（hooks.c:6398），所以在策略里",
        "                  不需要任何 type_transition，二进制也不用打标签。",
        "  caps         —— ★ 这个字段是**整套替换**，不是追加。实测踩过：",
        "                  init 把 capData 零初始化、只 OR 进列出的能力再 capset()",
        "                  （init_common_service.c:233-255），所以 [\"SYSLOG\"] 的真实含义是",
        "                  「这个进程**只有** CAP_SYSLOG」，连 uid 0 也不再绕过 DAC。",
        "                  应用沙箱目录是 0770、属主是应用 uid、other 无任何权限，",
        "                  于是 fopen(guard.on) 直接 EACCES。而 DAC 失败**不产生 AVC**，",
        "                  现象因此极具误导性：服务活着、在 sleep(1) 里空转、",
        "                  dmesg 里连一条 pl_collector 的 denial 都没有 ——",
        "                  看起来像策略没给够，其实是能力没给。",
        "                  策略里那条 (allow pl_collector self (capability (dac_override",
        "                  dac_read_search))) 假设的正是「它持有这个能力」，两边必须一致。",
        "                  CAP_DAC_OVERRIDE 是穿过那个 0770 目录的最小能力，所以只加它。"
    ],
    "services" : [{
            "name" : "pl_collector",
            "path" : ["/system/bin/pl_collector",
                      "--guard", "--dedupe", "--kmsg",
                      "--dir", "/data/app/el2/100/base/com.policyloop.console/haps/entry/files"],
            "uid" : "root",
            "gid" : ["system"],
            "once" : 0,
            "disabled" : 0,
            "sandbox" : 0,
            "caps" : ["SYSLOG", "DAC_OVERRIDE"],
            "secon" : "u:r:pl_collector:s0"
        }
    ]
}
